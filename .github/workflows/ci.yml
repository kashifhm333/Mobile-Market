name: MobileMart CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Backend Integration Tests
        run: npm run test:backend
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/mobilemart_test
          JWT_SECRET: ci_secret_key_testing_mobilemart_super_secure_32

      - name: Run Frontend Component Tests
        run: npm run test:frontend

      - name: Run Frontend Production Build
        run: npm run build
